<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Division Vanguard - Accès Sécurisé</title>
    <style>
        body { background-color: #1a1a1a; color: #e0e0e0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background-color: #2b2b2b; padding: 40px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); text-align: center; width: 350px; }
        h1 { color: #ffffff; margin-bottom: 20px; font-size: 24px; }
        input[type="password"] { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #444; border-radius: 4px; background-color: #333; color: white; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background-color: #2b3a55; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; margin-top: 10px; }
        button:hover { background-color: #34568b; }
        .error { color: #e74c3c; margin-top: 15px; font-size: 14px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Division Vanguard</h1>
        <p>Veuillez entrer le code d'accès sécurisé.</p>
        <form action="/verify-password" method="POST">
            <input type="password" name="password" placeholder="Code d'accès" required>
            <button type="submit">Vérifier</button>
        </form>
    </div>
</body>
</html>
