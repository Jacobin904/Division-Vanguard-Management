<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Division Vanguard — Accès sécurisé</title>
<style>
:root { --fond:#14161a; --carte:#1e2126; --bord:#2c3138; --accent:#2b3a55; --accent2:#34568b; --texte:#e6e8ea; --sourd:#8b929b; }
* { box-sizing:border-box; }
body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
       background:var(--fond); color:var(--texte); font-family:'Segoe UI',system-ui,sans-serif; }
.carte { width:100%; max-width:400px; background:var(--carte); border:1px solid var(--bord);
         border-top:3px solid var(--accent2); border-radius:6px; padding:36px; }
h1 { margin:0 0 6px; font-size:20px; letter-spacing:1.5px; text-transform:uppercase; }
p.sous { margin:0 0 26px; color:var(--sourd); font-size:13px; }
label { display:block; font-size:12px; text-transform:uppercase; letter-spacing:1px;
        color:var(--sourd); margin:16px 0 6px; }
input { width:100%; padding:12px; background:#15181c; border:1px solid var(--bord);
        border-radius:4px; color:var(--texte); font-size:15px; }
input:focus { outline:none; border-color:var(--accent2); }
button { width:100%; margin-top:24px; padding:13px; background:var(--accent); color:#fff;
         border:none; border-radius:4px; font-size:15px; font-weight:600; cursor:pointer; }
button:hover { background:var(--accent2); }
.aide { margin-top:22px; padding-top:18px; border-top:1px solid var(--bord);
        font-size:12px; color:var(--sourd); line-height:1.7; }
</style>
</head>
<body>
<div class="carte">
    <h1>Division Vanguard</h1>
    <p class="sous">Portail interne — personnel autorisé uniquement</p>
    <form action="/verify" method="POST">
        <label for="password">Code d'accès</label>
        <input type="password" id="password" name="password" autocomplete="off" required>
        <label for="discordId">Identifiant Discord</label>
        <input type="text" id="discordId" name="discordId" inputmode="numeric"
               pattern="[0-9]{17,20}" placeholder="1281784488854159421" required>
        <button type="submit">Vérifier mon accès</button>
    </form>
    <div class="aide">
        Pour obtenir votre identifiant : activez le mode développeur dans les paramètres
        Discord, puis faites un clic droit sur votre nom et choisissez « Copier l'ID ».
    </div>
</div>
</body>
</html>
